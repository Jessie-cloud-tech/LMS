name: LMS CI

on: [push, pull_request]

jobs:
  build-and-test:
    name: Build, Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            gcovr

      - name: Configure with coverage
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLMS_BUILD_TESTS=ON \
            -DLMS_COVERAGE=ON

      - name: Build LMS
        run: cmake --build build --parallel 2

      - name: Run all tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        if: always()
        run: |
          gcovr -r . \
            --object-directory build \
            --filter 'src/(authservice|auditservice|submissionservice|moderationservice|standardLinearPenaltyStrategy|ipenaltyStrategy|submission)\.cpp' \
            --print-summary \
            --html-details build/coverage.html \
            --xml build/coverage.xml

      - name: Enforce minimum 70% coverage
        if: success()
        run: |
          gcovr -r . \
            --object-directory build \
            --filter 'src/(authservice|auditservice|submissionservice|moderationservice|standardLinearPenaltyStrategy|ipenaltyStrategy|submission)\.cpp' \
            --fail-under-line 70

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LMS-test-and-coverage-reports
          if-no-files-found: warn
          path: |
            build/coverage.html
            build/coverage.xml
